services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC (app -> collector)
      - "4318:4318" # OTLP HTTP (app -> collector)
    depends_on:
      - tempo
      - loki
      - prometheus
      - signoz # SigNoz's own OTLP receiver, exported to in parallel with Tempo/Loki/Prometheus

  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver" # accepts otel-collector's pushed metrics directly, no scraping needed
      - "--enable-feature=exemplar-storage" # required to store the exemplars Tempo attaches to generated metrics
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.7.7@sha256:d70e4659623f3e109af669cae76fe2a5dd5be54e2298fe8aed380d982fbc2500
    container_name: loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:3.0.0@sha256:78439f7f7cf3c97122846c13a832e060c6c7ef67dcc814dccf0a5f3f78393a93
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200" # Tempo query API/UI backend (used by Grafana)
    depends_on:
      - prometheus # metrics-generator remote-writes span-derived metrics here

  grafana:
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    container_name: grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true # skip the login screen entirely
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro # auto-loads the datasources below on startup
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

  # SigNoz: a second, independent observability backend fed by the same otel-collector.
  # This is the same five SigNoz processes (ClickHouse, ClickHouse Keeper, the OTLP ingester, the UI)
  # as a hand-assembled multi-container setup, just packed into one image and managed by systemd inside
  # it instead of by docker-compose - hence --privileged, which systemd needs to run inside the container.
  # See docs/signoz-integration.md for the trade-offs of this image versus the multi-container form.
  signoz:
    image: signoz/signoz-standalone:v0.0.4@sha256:2b80f2188434b8910777edeb431d13ea1315dbcb30e6aa6ec705fc3405f113be
    container_name: signoz-standalone
    privileged: true # required: this image runs systemd internally to manage its bundled ClickHouse/ingester/UI processes
    # note: docker-level `environment:` here does NOT reach the systemd-managed processes inside (see docs/signoz-integration.md) -
    # the JWT-secret security warning in this image's logs is a known, currently unavoidable cosmetic issue of this packaging
    volumes:
      - signoz_clickhouse_data:/var/lib/clickhouse
      - signoz_app_data:/var/lib/signoz
    ports:
      - "5317:4317" # remapped from 4317 - the app-facing otel-collector already owns that port on the host
      - "5318:4318"
      - "8081:8080" # remapped from 8080 - the Spring Boot app itself already owns that port on the host

volumes:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
  signoz_clickhouse_data:
  signoz_app_data:
