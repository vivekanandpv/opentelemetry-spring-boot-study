spring:
  application:
    name: opentelemetry-spring-boot-study
  datasource:
    url: jdbc:h2:file:./data/customerdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  structured:
    format:
      # native Spring Boot structured (JSON) console logging, Elastic Common Schema
      console: ecs

management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    resource-attributes:
      deployment.environment: local
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
