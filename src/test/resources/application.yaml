spring:
  datasource:
    url: jdbc:h2:mem:customerdb-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: false

logging:
  structured:
    format:
      console: ecs
