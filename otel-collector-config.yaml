receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # refuses new data once memory crosses the limit instead of letting the collector OOM; must run first in every pipeline
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

  # tags everything passing through with a collector-level attribute, independent of what any one service sets itself
  resource:
    attributes:
      - key: collector.name
        value: otel-collector-local
        action: upsert

  # strips the raw request URL from spans; the templated route attribute already has what's needed, without the cardinality/PII risk of a raw URL
  attributes/scrub_url:
    actions:
      - key: http.url
        action: delete

  # PSEUDONYMIZATION: one-way SHA1 hash of the customer id wherever it appears, on spans and on logs - keeps the value
  # joinable across a single trace/session without exposing the raw database identifier to either storage backend
  attributes/hash_customer_id:
    actions:
      - key: customer.id
        action: hash
      - key: customerId
        action: hash

  # SURGICAL REDACTION via OTTL: reaches into places attributes/redaction processors can't - span EVENT attributes, the
  # span's own status message, and the log body itself - masking any email-shaped substring wherever it's hiding
  transform/redact_pii:
    error_mode: ignore
    trace_statements:
      - replace_pattern(spanevent.attributes["exception.message"], "[\\w.+-]+@[\\w-]+\\.[a-zA-Z]{2,}", "[REDACTED_EMAIL]") where spanevent.name == "exception"
      - replace_pattern(spanevent.attributes["exception.stacktrace"], "[\\w.+-]+@[\\w-]+\\.[a-zA-Z]{2,}", "[REDACTED_EMAIL]") where spanevent.name == "exception"
      - replace_pattern(span.status.message, "[\\w.+-]+@[\\w-]+\\.[a-zA-Z]{2,}", "[REDACTED_EMAIL]") # the OTel Status object's own message - separate from both attributes and events, easy to miss
    log_statements:
      - replace_pattern(log.body, "[\\w.+-]+@[\\w-]+\\.[a-zA-Z]{2,}", "[REDACTED_EMAIL]") # dormant today (DEBUG logging is off) but future-proofs the log body regardless

  # LAST LINE OF DEFENSE: only these span/log attribute keys are allowed through at all - anything unexpected (a future
  # dev accidentally attaching a raw email/name/phone as a new attribute) gets stripped entirely, not just missed
  redaction:
    allow_all_keys: false
    allowed_keys:
      # resource-level: without these, the allow-list strips them too, and Tempo/SigNoz lose the ability to identify the service at all
      - service.name
      - collector.name
      - deployment.environment
      - telemetry.sdk.language
      - telemetry.sdk.name
      - telemetry.sdk.version
      # span-level
      - exception
      - uri
      - method
      - outcome
      - status
      - customer.id
      - customer.count
      - customerId
      - path
      - violationCount
      - exceptionType
      # span EVENT attributes - kept so transform/redact_pii's in-place email redaction above stays visible instead of the whole field vanishing
      - exception.type
      - exception.message
      - exception.stacktrace
    blocked_values:
      - "[\\w.+-]+@[\\w-]+\\.[a-zA-Z]{2,}" # catches an email-shaped value even on an allowed key
    summary: info

  # HEAD-BASED sampling: decides per-trace, at the very start, before any span exists - cheap and stateless, but blind to
  # how the trace turns out (an error and a boring success are equally likely to be kept). Commented out in favor of
  # tail_sampling below; flip this back on and comment out tail_sampling to compare the two strategies directly.
  # probabilistic_sampler:
  #   sampling_percentage: 20

  # TAIL-BASED sampling: buffers each trace's spans until it completes (or 10s passes), then decides using what actually
  # happened - always keeps error responses and slow requests in full, and probabilistically thins out the rest.
  tail_sampling:
    decision_wait: 10s # how long to buffer a trace's spans before deciding; must exceed how long this app's traces take to finish
    num_traces: 50000 # in-memory buffer capacity across all traces currently being decided on
    expected_new_traces_per_sec: 50
    policies:
      - name: keep-errors
        type: string_attribute
        string_attribute:
          key: status # the HTTP status attribute Micrometer's WebMvc observation sets on the root span
          values: ["400", "404", "409", "500"]
      - name: keep-slow
        type: latency
        latency:
          threshold_ms: 50 # generous for this app's normal sub-10ms responses; still low enough to catch real contention
      - name: sample-the-rest
        type: probabilistic
        probabilistic:
          sampling_percentage: 20 # everything that isn't an error or slow: keep a representative 1-in-5 slice

  # drops routine framework startup/connection-pool chatter at the collector instead of paying to store logs nobody queries
  filter/drop_framework_noise:
    logs:
      log_record:
        - 'IsMatch(instrumentation_scope.name, "org\\.hibernate.*|com\\.zaxxer\\.hikari.*")'

  # groups telemetry before export instead of sending one request per record/span/metric; must run last, right before the exporters
  batch: {}

exporters:
  # traces -> Tempo's native OTLP gRPC receiver
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true # internal docker network traffic only, no TLS needed

  # logs -> Loki's native OTLP ingestion endpoint; keeps trace_id/span_id as queryable structured metadata
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  # metrics -> Prometheus' remote-write receiver (push model; no scrape_config needed on the Prometheus side)
  prometheus_remote_write:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true

  # all three signals -> SigNoz's own OTLP receiver, run as a second, independent backend alongside Tempo/Loki/Prometheus
  otlp_grpc/signoz:
    endpoint: ingester:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, attributes/scrub_url, attributes/hash_customer_id, transform/redact_pii, redaction, tail_sampling, batch]
      exporters: [otlp_grpc/tempo, otlp_grpc/signoz]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus_remote_write, otlp_grpc/signoz]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, filter/drop_framework_noise, attributes/hash_customer_id, transform/redact_pii, redaction, batch]
      exporters: [otlp_http/loki, otlp_grpc/signoz]
