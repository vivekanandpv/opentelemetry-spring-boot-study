# single-tenant local setup: no per-request auth header required
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory # single-node deployment, no external ring coordination needed

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13 # required for structured metadata support
      index:
        prefix: index_
        period: 24h

limits_config:
  # stores OTel trace_id/span_id as queryable metadata instead of discarding them
  allow_structured_metadata: true
